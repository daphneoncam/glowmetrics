name: CamCash Test Suite

on:
  push:
    branches:
      - claude/*
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run (all, api, ui, formulas)'
        required: false
        default: 'all'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./glowmetrics_fresh
        run: npm install --no-audit --no-fund

      - name: Run tests with coverage
        working-directory: ./glowmetrics_fresh
        run: |
          mkdir -p test-results
          npm run test:ci
        env:
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Generate test report
        if: always()
        working-directory: ./glowmetrics_fresh
        run: npm run test:report

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}
          path: glowmetrics_fresh/test-results/
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.run_id }}
          path: glowmetrics_fresh/coverage/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const resultsPath = './glowmetrics_fresh/test-results/results.json';
            if (!fs.existsSync(resultsPath)) {
              console.log('No test results found - tests may have failed to run');
              return;
            }

            const testResults = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));

            const totalDuration = testResults.testResults
              ? (testResults.testResults.reduce((a, r) => a + (r.perfStats?.end - r.perfStats?.start || 0), 0) / 1000).toFixed(2)
              : 'N/A';

            const message = `## Test Results

            - **Tests Passed**: ${testResults.numPassedTests || 0}/${testResults.numTotalTests || 0}
            - **Suites Passed**: ${testResults.numPassedTestSuites || 0}/${testResults.numTotalTestSuites || 0}
            - **Duration**: ${totalDuration}s

            ${testResults.numFailedTests > 0 ? `⚠️ **${testResults.numFailedTests} test(s) failed**` : '✅ All tests passed'}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Fail if tests failed
        if: failure()
        run: exit 1
