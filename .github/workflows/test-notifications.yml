name: Test Notifications

on:
  workflow_run:
    workflows: ["CamCash Test Suite"]
    types:
      - completed

jobs:
  notify-slack:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'success'
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          name: test-results-${{ github.event.workflow_run.id }}
          path: test-results
        continue-on-error: true

      - name: Parse test results
        id: parse
        run: |
          if [ -f "test-results/summary.json" ]; then
            PASSED=$(jq -r '.numPassedTests // 0' test-results/summary.json)
            FAILED=$(jq -r '.numFailedTests // 0' test-results/summary.json)
            DURATION=$(jq -r '.testResults[0].perfStats.end // 0' test-results/summary.json)
          else
            PASSED="unknown"
            FAILED="unknown"
            DURATION="unknown"
          fi

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

      - name: Notify Slack on Failure
        uses: slackapi/slack-github-action@v1.25.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "🚨 CamCash Test Failure",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 CamCash Tests Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n❌ Failed"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.event.workflow_run.head_branch }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Tests Passed:*\n${{ steps.parse.outputs.passed }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Tests Failed:*\n${{ steps.parse.outputs.failed }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Commit:*\n<${{ github.event.workflow_run.head_commit.html_url }}|${{ github.event.workflow_run.head_commit.message }}>"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "${{ github.event.workflow_run.html_url }}",
                      "style": "danger"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View PR"
                      },
                      "url": "https://github.com/${{ github.repository }}/pulls?q=head:${{ github.event.workflow_run.head_branch }}",
                      "style": "primary"
                    }
                  ]
                }
              ]
            }
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}

      - name: Notify Slack on Success
        uses: slackapi/slack-github-action@v1.25.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ CamCash Tests Passed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "✅ CamCash Tests Passed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n✅ All Passed"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.event.workflow_run.head_branch }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "${{ github.event.workflow_run.html_url }}"
                    }
                  ]
                }
              ]
            }
        if: ${{ github.event.workflow_run.conclusion == 'success' && env.SLACK_WEBHOOK_URL != '' }}
