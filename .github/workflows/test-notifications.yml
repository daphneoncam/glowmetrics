name: Test Notifications

on:
  workflow_run:
    workflows: ["CamCash Test Suite"]
    types:
      - completed

# Least privilege (CodeQL actions/missing-workflow-permissions). Sends to
# Slack via a webhook secret; only needs to read code and run artifacts.
permissions:
  contents: read
  actions: read

jobs:
  notify-slack:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'success'
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results-${{ github.event.workflow_run.id }}
          path: test-results
        continue-on-error: true

      - name: Parse test results
        id: parse
        run: |
          if [ -f "test-results/summary.json" ]; then
            PASSED=$(jq -r '.numPassedTests // 0' test-results/summary.json)
            FAILED=$(jq -r '.numFailedTests // 0' test-results/summary.json)
            DURATION=$(jq -r '.testResults[0].perfStats.end // 0' test-results/summary.json)
          else
            PASSED="unknown"
            FAILED="unknown"
            DURATION="unknown"
          fi

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

      # Branch names and commit messages are chosen by whoever pushed (forks
      # included). Escape them for JSON + Slack mrkdwn here, via env vars (never
      # interpolated into the script), instead of pasting them raw into the
      # payload below, where a quote or newline broke the JSON and could
      # inject Slack blocks.
      - name: Sanitize workflow-run fields for Slack
        id: safe
        env:
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          RUN_COMMIT_URL: ${{ github.event.workflow_run.head_commit.html_url }}
        run: |
          slack_escape='gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;")'
          json_body='@json | .[1:-1]'
          branch=$(jq -rn --arg v "$RUN_BRANCH" "\$v | $slack_escape | $json_body")
          branch_uri=$(jq -rn --arg v "$RUN_BRANCH" '$v | @uri')
          subject=$(printf '%s' "$RUN_COMMIT_MESSAGE" | head -n 1 | cut -c1-150)
          message=$(jq -rn --arg v "$subject" "\$v | $slack_escape | gsub(\"[|]\";\"/\") | $json_body")
          commit_url=$(jq -rn --arg v "$RUN_COMMIT_URL" "\$v | $json_body")
          {
            echo "branch=$branch"
            echo "branch_uri=$branch_uri"
            echo "message=$message"
            echo "commit_url=$commit_url"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack on Failure
        uses: slackapi/slack-github-action@v1.25.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "🚨 CamCash Test Failure",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 CamCash Tests Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n❌ Failed"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ steps.safe.outputs.branch }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Tests Passed:*\n${{ steps.parse.outputs.passed }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Tests Failed:*\n${{ steps.parse.outputs.failed }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Commit:*\n<${{ steps.safe.outputs.commit_url }}|${{ steps.safe.outputs.message }}>"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "${{ github.event.workflow_run.html_url }}",
                      "style": "danger"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View PR"
                      },
                      "url": "https://github.com/${{ github.repository }}/pulls?q=head:${{ steps.safe.outputs.branch_uri }}",
                      "style": "primary"
                    }
                  ]
                }
              ]
            }
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}

      - name: Notify Slack on Success
        uses: slackapi/slack-github-action@v1.25.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ CamCash Tests Passed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "✅ CamCash Tests Passed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n✅ All Passed"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ steps.safe.outputs.branch }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow"
                      },
                      "url": "${{ github.event.workflow_run.html_url }}"
                    }
                  ]
                }
              ]
            }
        if: ${{ github.event.workflow_run.conclusion == 'success' && env.SLACK_WEBHOOK_URL != '' }}
