name: Test Failure Notifications

on:
  workflow_run:
    workflows:
      - 'Daily Test Suite Execution'
      - 'Test Integrity Guard'
      - 'Production Health Check'
    types:
      - completed

jobs:
  notify-on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    name: Send Failure Alert

    permissions:
      issues: write
      actions: read

    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/
        continue-on-error: true

      # Workflow-run fields (branch name, actor, etc.) are passed via env, never
      # interpolated into scripts, so a crafted branch name cannot inject code.
      - name: Create GitHub issue for failure
        uses: actions/github-script@v7
        env:
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WF_SHA: ${{ github.event.workflow_run.head_sha }}
          WF_ACTOR: ${{ github.event.workflow_run.actor.login }}
          WF_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const { WF_NAME, WF_BRANCH, WF_SHA, WF_ACTOR, WF_RUN_ID } = process.env;
            const commit = (WF_SHA || '').slice(0, 8);
            const timestamp = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${WF_RUN_ID}`;
            const body = [
              '❌ **Test Failure Alert**',
              '',
              `**Workflow:** ${WF_NAME}`,
              `**Time:** ${timestamp}`,
              `**Branch:** ${WF_BRANCH}`,
              `**Commit:** ${commit}`,
              `**Author:** ${WF_ACTOR}`,
              '',
              '**Action Required:**',
              `- View workflow logs: ${runUrl}`,
              '- Check test results in artifacts',
              '- All 427 tests must pass before deployment',
              '',
              '**Severity:** HIGH - Production quality check failed',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ ${WF_NAME} Failed (${commit})`,
              body,
              labels: ['test-failure', 'urgent'],
              assignees: WF_ACTOR ? [WF_ACTOR] : [],
            });
            console.log(`Failure issue created for ${runUrl}`);

  notify-on-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Send Success Confirmation

    steps:
      - name: Log success
        run: |
          echo "✅ ${{ github.event.workflow_run.name }} completed successfully"
          echo "📅 Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "🎯 All checks passing - production ready"
