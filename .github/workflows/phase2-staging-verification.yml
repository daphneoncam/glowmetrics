                    status: "ended",
                    total_paused_seconds: 0,
                    final_duration_seconds: 15 * 60
                  })
                  .select();

                if (sessionAError) throw sessionAError;
                scenario14SessionAId = sessionAData[0].id;

                const { data: sessionBData, error: sessionBError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert({
                    user_id: s14UserId,
                    started_at: sessionBStart,
                    ended_at: sessionBEnd,
                    status: "ended",
                    total_paused_seconds: 0,
                    final_duration_seconds: 15 * 60
                  })
                  .select();

                if (sessionBError) throw sessionBError;
                scenario14SessionBId = sessionBData[0].id;

                const { data: tipData, error: tipError } = await serviceRoleClient.rpc(
                  "persist_extension_tip",
                  {
                    p_user_id: s14UserId,
                    p_client_event_id: generateUUID(),
                    p_deduplication_key: null,
                    p_username: "ambiguous_tipper",
                    p_tokens: 1000,
                    p_usd: 25.00,
                    p_platform: "twitch",
                    p_event_at: tipEventAt.toISOString(),
                    p_queued_ms: null
                  }
                );

                if (tipError) throw tipError;

                // Contract: live_session_id === null, exactly one ambiguity log
                const failures = [];

                if (tipData.live_session_id !== null) failures.push(`live_session_id=${tipData.live_session_id} (expected null)`);
                if (!tipData.success) failures.push(`success=${tipData.success} (expected true)`);

                // Contract: MUST verify exactly one unattributed_tips_log row with reason='multiple_session_matches'
                // Use approved helper RPC (verify_ambiguity_logs_for_user) that bypasses RLS
                let logVerified = false;
                let logCount = 0;

                const { data: logResult, error: logError } = await serviceRoleClient
                  .rpc("verify_ambiguity_logs_for_user", {
                    p_user_id: s14UserId,
                    p_reason: "multiple_session_matches"
                  });

                if (!logError && logResult && Array.isArray(logResult)) {
                  // Helper RPC returns array of {reason, count} rows
                  if (logResult.length === 1) {
                    logCount = parseInt(logResult[0].count) || 0;
                    logVerified = true;
                    if (logCount !== 1) {
                      failures.push(`ambiguity log row count=${logCount} (expected exactly 1 row with reason='multiple_session_matches')`);
                    }
                  } else if (logResult.length === 0) {
                    failures.push(`ambiguity log: no rows found for 'multiple_session_matches' (expected exactly 1)`);
                  } else {
                    failures.push(`ambiguity log: unexpected row count ${logResult.length}`);
                  }
                } else if (logError) {
                  // Verification unavailable - strict contract requires failure
                  failures.push(`CRITICAL: ambiguity-log verification blocked (${logError.message}). Require approved read path.`);
                }

                const passed = failures.length === 0;
                s14Result.passed = passed;
                s14Result.message = passed
                  ? `✓ live_session_id=null, ambiguity log verified (${logCount} row with reason='multiple_session_matches')`
                  : `✗ ${failures.join("; ")}`;

                printResult(
                  "Overlapping sessions → unattributed + ambiguity log",
                  14,
                  passed,
                  "live_session_id=null, exactly 1 ambiguity log with reason='multiple_session_matches'",
                  s14Result.message
                );
              } catch (error) {
                s14Result.passed = false;
                s14Result.message = error.message;
                printResult("Overlapping sessions", 14, false, "Ambiguity logged", `Error: ${error.message}`);
              } finally {
                if (s14UserId) {
                  await cleanupUserFixtures(serviceRoleClient, s14UserId);
                  await cleanupTempAuthUser(serviceRoleClient, s14UserId);
                }
              }

              // ========== SCENARIO 15 ==========
              let s15UserId = null;
              let s15AuthClient = null;
              let s15Result = { passed: false, message: "Not executed" };
              try {
                const tempUser = await createTempAuthUser(serviceRoleClient);
                s15UserId = tempUser.userId;
                createdAuthUsers.push(s15UserId);
                s15AuthClient = await createAuthenticatedClient(tempUser);

                const startTime = new Date(Date.now() - 60 * 60 * 1000);
                const s15SessionId = generateUUID();
                const tipClientEventId = generateUUID();

                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert({
                    id: s15SessionId,
                    user_id: s15UserId,
                    started_at: startTime,
                    status: "live", live_substate: "active"
                  })
                  .select();

                if (sessionError) throw sessionError;

                // Run persistence and finalization concurrently
                const tipPromise = serviceRoleClient.rpc("persist_extension_tip", {
                  p_user_id: s15UserId,
                  p_client_event_id: tipClientEventId,
                  p_deduplication_key: null,
                  p_username: "concurrent_tipper",
                  p_tokens: 1000,
                  p_usd: 25.00,
                  p_platform: "twitch",
                  p_event_at: new Date().toISOString(),
                  p_queued_ms: null
                });

                const finalizePromise = stopSession(s15AuthClient, serviceRoleClient, s15SessionId);

                const [tipResult, finalResult] = await Promise.all([tipPromise, finalizePromise]);

                if (tipResult.error) throw tipResult.error;
                if (finalResult.error) throw finalResult.error;

                // Contract: After both settle, verify post-race database state.
                // Stop's own return value is a snapshot from whichever side of
                // the race it landed on; if it ended the session first, the tip
                // reconciles afterwards and re-finalizes. The saved row is the truth.
                const { data: settledRow, error: settledErr } = await serviceRoleClient
                  .from("live_sessions").select("*").eq("id", s15SessionId).single();
                if (settledErr) throw settledErr;
                finalResult.data = settledRow;
                const failures = [];

                // Check session is ended
                if (finalResult.data.status !== "ended") failures.push(`session status=${finalResult.data.status} (expected ended)`);

                // Check exactly one logical event (live_tips row)
                const { data: liveTipsRows, error: liveTipsError } = await serviceRoleClient
                  .from("live_tips")
                  .select("*")
                  .eq("user_id", s15UserId)
                  .eq("live_session_id", s15SessionId);

                if (!liveTipsError && liveTipsRows && liveTipsRows.length !== 1) {
                  failures.push(`live_tips row count=${liveTipsRows.length} (expected exactly 1)`);
                } else if (liveTipsError && !liveTipsError.message.includes("permission")) {
                  failures.push(`live_tips query error: ${liveTipsError.message}`);
                }

                // Check exactly one canonical tip (tips table)
                const { data: tipsRows, error: tipsError } = await serviceRoleClient
                  .from("tips")
                  .select("*")
                  .eq("user_id", s15UserId)
                  .eq("client_event_id", tipClientEventId);

                if (!tipsError && tipsRows && tipsRows.length !== 1) {
                  failures.push(`tips row count=${tipsRows.length} (expected exactly 1)`);
                } else if (tipsError && !tipsError.message.includes("permission")) {
                  failures.push(`tips query error: ${tipsError.message}`);
                }

                // Verify tip attribution and final metrics
                if (tipResult.data.live_session_id !== s15SessionId) {
                  failures.push(`tip live_session_id=${tipResult.data.live_session_id} (expected ${s15SessionId})`);
                }
                if (Math.abs(finalResult.data.final_total_usd - 25.00) > 0.01) {
                  failures.push(`final_total_usd=${finalResult.data.final_total_usd} (expected 25.00, tip not included)`);
                }
                if (finalResult.data.final_tip_count !== 1) {
                  failures.push(`final_tip_count=${finalResult.data.final_tip_count} (expected 1)`);
                }

                // S15: Verify advisory lock architecture - EXPLICIT verification required
                // Required contract: Both persist_extension_tip and finalize_live_session must use
                // identical user-level advisory lock: pg_advisory_xact_lock(hashtextextended(user_id::text, 0)::bigint)
                // This is NOT implied by S13 passing - S13 can pass with correct metrics even if locks differ.
                // Must verify actual installed function definitions using helper RPC.

                let lockVerifyPassed = false;

                const { data: lockData, error: lockError } = await serviceRoleClient
                  .rpc("verify_function_lock_expressions");

                if (!lockError && lockData) {
                  const persistDefined = lockData.persist_extension_tip_defined === true;
                  const finalizeDefined = lockData.stop_live_session_defined === true && lockData.finalizer_defined === true;
                  const persistHasUserLock = lockData.persist_has_user_lock === true;
                  const finalizeHasUserLock = lockData.stop_has_user_lock === true && lockData.finalizer_has_user_lock === true;
                  const persistHasCompositeLock = lockData.persist_has_composite_lock === true;

                  if (!persistDefined) {
                    failures.push(`persist_extension_tip not installed`);
                  }
                  if (!finalizeDefined) {
                    failures.push(`stop_live_session or _finalize_live_session_metrics not installed`);
                  }
                  if (persistHasCompositeLock) {
                    failures.push(`CRITICAL: persist_extension_tip uses composite lock (user:event), not user-level lock`);
                  }
                  if (!persistHasUserLock && !persistHasCompositeLock && persistDefined) {
                    failures.push(`persist_extension_tip: user-level lock not found`);
                  }
                  if (!finalizeHasUserLock && finalizeDefined) {
                    failures.push(`stop_live_session/_finalize_live_session_metrics: user-level lock not found`);
                  }

                  if (persistHasUserLock && finalizeHasUserLock && !persistHasCompositeLock) {
                    console.log(`✓ Advisory lock serialization explicitly verified: both functions use user-level locks`);
                    lockVerifyPassed = true;
                  }
                } else if (lockError) {
                  failures.push(`Lock verification failed: ${lockError.message}`);
                }

                if (!tipResult.data.success) failures.push(`tip success=${tipResult.data.success} (expected true)`);

                const passed = failures.length === 0;
                s15Result.passed = passed;
                s15Result.message = passed
                  ? `✓ Race-safe: 1 logical event, 1 live_tip row, 1 canonical tip, attributed, metrics $25 (1 tip)`
                  : `✗ ${failures.join("; ")}`;

                printResult(
                  "Advisory lock prevents race conditions",
                  15,
                  passed,
                  "Exactly 1 event, 1 live_tip, 1 canonical tip, attributed, metrics include tip",
                  s15Result.message
                );
              } catch (error) {
                s15Result.passed = false;
                s15Result.message = error.message;
                printResult("Advisory lock", 15, false, "Operations safe", `Error: ${error.message}`);
              } finally {
                if (s15UserId) {
                  await cleanupUserFixtures(serviceRoleClient, s15UserId);
                  await cleanupTempAuthUser(serviceRoleClient, s15UserId);
                }
              }

              // ========== SCENARIO 16 ==========
              let s16UserId = null;
              let s16AuthClient = null;
              let s16Result = { passed: false, message: "Not executed" };
              try {
                const tempUser = await createTempAuthUser(serviceRoleClient);
                s16UserId = tempUser.userId;
                createdAuthUsers.push(s16UserId);

                s16AuthClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const { error: signInErr } = await s16AuthClient.auth.signInWithPassword({
                  email: tempUser.email,
                  password: tempUser.password
                });

                if (signInErr) throw new Error(`Failed to sign in temp user: ${signInErr.message}`);

                // Attempt to call RPC with authenticated user trying to persist tip for a different user
                const { data: tipData, error: tipError } = await s16AuthClient.rpc(
                  "persist_extension_tip",
                  {
                    p_user_id: s16UserId,
                    p_client_event_id: generateUUID(),
                    p_deduplication_key: null,
                    p_username: "auth_test_tipper",
                    p_tokens: 1000,
                    p_usd: 25.00,
                    p_platform: "twitch",
                    p_event_at: new Date().toISOString(),
                    p_queued_ms: null
                  }
                );

                // Contract: Must reject with PostgreSQL error code 42501 (permission denied)
                // and message must indicate the function itself denied execution
                const hasProperErrorCode = tipError && tipError.code === '42501';
                const hasProperMessage = tipError && tipError.message &&
                  tipError.message.includes("permission denied for function persist_extension_tip");
                const passed = hasProperErrorCode && hasProperMessage;

                s16Result.passed = passed;
                if (!tipError) {
                  s16Result.message = "No error returned (expected 42501 permission denied)";
                } else if (!hasProperErrorCode) {
                  s16Result.message = `Wrong error code: ${tipError.code} (expected 42501)`;
                } else if (!hasProperMessage) {
                  s16Result.message = `Wrong message: "${tipError.message}" (expected to mention function-level denial)`;
                } else {
                  s16Result.message = `✓ Properly denied: ${tipError.message}`;
                }

                printResult(
                  "Direct authenticated execution denied",
                  16,
                  passed,
                  "Function execution denied",
                  s16Result.message
                );
              } catch (error) {
                const passed = error.message.includes("permission") || error.message.includes("denied");
                s16Result.passed = passed;
                s16Result.message = `Exception: ${error.message}`;
                printResult(
                  "Direct authenticated execution denied",
                  16,
                  passed,
                  "Function execution denied",
                  s16Result.message
                );
              } finally {
                if (s16UserId) {
                  await cleanupUserFixtures(serviceRoleClient, s16UserId);
                  await cleanupTempAuthUser(serviceRoleClient, s16UserId);
                }
              }

              // ========== SCENARIO 17 ==========
              let s17UserId = null;
              let s17Result = { passed: false, message: "Not executed" };
              try {
                const tempUser = await createTempAuthUser(serviceRoleClient);
                s17UserId = tempUser.userId;
                createdAuthUsers.push(s17UserId);

                // Create session with real Auth user
                const { data: sessionData, error: sessionError } = await serviceRoleClient
                  .from("live_sessions")
                  .insert({
                    user_id: s17UserId,
                    started_at: new Date(Date.now() - 60 * 60 * 1000),
                    status: "live", live_substate: "active"
                  })
                  .select();

                if (sessionError) throw sessionError;

                const { data: tipData, error: tipError } = await serviceRoleClient.rpc(
                  "persist_extension_tip",
                  {
                    p_user_id: s17UserId,
                    p_client_event_id: generateUUID(),
                    p_deduplication_key: null,
                    p_username: "service_role_tipper",
                    p_tokens: 1000,
                    p_usd: 50.00,
                    p_platform: "twitch",
                    p_event_at: new Date().toISOString(),
                    p_queued_ms: null
                  }
                );

                if (tipError) throw tipError;

                // Verify live_tips row created
                const { data: liveTips, error: liveErr } = await serviceRoleClient
                  .from("live_tips")
                  .select("*")
                  .eq("client_event_id", tipData.client_event_id);

                if (liveErr && !liveErr.message.includes("permission")) throw liveErr;
                if (liveErr && liveErr.message.includes("permission")) {
                  console.log(`⚠ Skipping live_tips verification (ACL denied)`);
                }

                const passed = tipData.success && tipData.live_tip_id;
                s17Result.passed = passed;
                s17Result.message = `success=${tipData.success}, has_live_tip_id=${!!tipData.live_tip_id}`;

                printResult(
                  "Service-role/API execution succeeds",
                  17,
                  passed,
                  "Function executes with service_role",
                  s17Result.message
                );
              } catch (error) {
                s17Result.passed = false;
                s17Result.message = error.message;
                printResult("Service-role execution", 17, false, "Function executes", `Error: ${error.message}`);
              } finally {
                if (s17UserId) {
                  await cleanupUserFixtures(serviceRoleClient, s17UserId);
                  await cleanupTempAuthUser(serviceRoleClient, s17UserId);
                }
              }

              // Global cleanup of any remaining auth users
              console.log("\nCleaning up remaining Auth users...");
              for (const userId of createdAuthUsers) {
                await cleanupTempAuthUser(serviceRoleClient, userId);
              }

              // Summary
              console.log("\n========== SUMMARY ==========");
              const passed = testResults.filter(r => r.passed).length;
              const failed = testResults.filter(r => !r.passed).length;

              testResults.forEach(r => {
                console.log(`Scenario ${r.scenario}: ${r.status}`);
              });

              console.log(`\nTotal: ${testResults.length}`);
              console.log(`Passed: ${passed}`);
              console.log(`Failed: ${failed}`);

              if (failed === 0) {
                console.log("\n✅ CORRECTED PHASE 2 STAGING VERIFIED");
                console.log("✅ 17/17 SCENARIOS PASSED");
                console.log("✅ READY FOR PRODUCTION MIGRATION REVIEW");
                process.exit(0);
              } else {
                console.log(`\n❌ ${failed} SCENARIO(S) FAILED`);
                console.log("❌ Do not proceed to production");
                process.exit(1);
              }

            } catch (error) {
              console.error("\n❌ FATAL ERROR:", error.message);
              // Attempt cleanup on fatal error
              for (const userId of createdAuthUsers) {
                try {
                  await cleanupTempAuthUser(serviceRoleClient, userId);
                } catch (e) {
                  console.log(`⚠ Could not cleanup ${userId}: ${e.message}`);
                }
              }
              process.exit(1);
            }
          }

          runTests();
          SCRIPT_END

      - name: Report Results
        if: success()
        run: |
          echo "✅ All 17 scenarios passed"
          echo "Ready for production migration review"

      - name: Report Failure
        if: failure()
        run: |
          echo "❌ Test suite failed"
          echo "Do not proceed to production"
          exit 1

  staging-smoke-test:
    name: Run Staging Smoke Test
    runs-on: ubuntu-latest
    environment:
      name: staging
    needs: staging-17-scenarios
    if: inputs.only_sessions != 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22+ (required for Supabase WebSocket support)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install app dependencies
        working-directory: glowmetrics_fresh
        run: npm install

      - name: Start staging API locally
        working-directory: glowmetrics_fresh
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
        run: |
          npm run dev > /tmp/camcash-next.log 2>&1 &
          echo $! > /tmp/camcash-next.pid

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/live/session/start -X OPTIONS >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Failed to start API. Server logs:"
          cat /tmp/camcash-next.log
          exit 1

      - name: Install smoke test dependencies
        working-directory: chrome-extension/tests
        run: npm install

      - name: Run Phase 2 Staging Smoke Test
        working-directory: chrome-extension/tests
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
          CAMCASH_STAGING_BASE_URL: http://127.0.0.1:3000
        run: npm run test:staging

      - name: Report Smoke Test Success
        if: success()
        run: |
          echo "✅ Phase 2 Staging Smoke Test PASSED"
          echo "✅ Extension → API → Database flow verified end-to-end"
          echo "Ready for production compatibility-patch review"

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Next.js Server Log ==="
          cat /tmp/camcash-next.log || echo "No log file found"

      - name: Report Smoke Test Failure
        if: failure()
        run: |
          echo "❌ Phase 2 Staging Smoke Test FAILED"
          echo "Do not proceed to production"
          exit 1

  staging-browser-pass:
    name: Real Chromium Browser Pass (staging)
    runs-on: ubuntu-latest
    environment:
      name: staging
    needs: staging-smoke-test
    if: always() && (needs.staging-smoke-test.result == 'success' || inputs.only_sessions == 'true')
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install app dependencies
        working-directory: glowmetrics_fresh
        run: npm install

      - name: Start app locally against staging
        working-directory: glowmetrics_fresh
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
        run: |
          npm run dev > /tmp/camcash-next.log 2>&1 &
          echo $! > /tmp/camcash-next.pid

      - name: Wait for app
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/api/live/session/start -X OPTIONS >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/camcash-next.log
          exit 1

      - name: Install browser test dependencies and Chromium
        working-directory: chrome-extension/tests
        run: |
          npm install
          npx playwright@$(node -p "require('playwright-core/package.json').version") install --with-deps chromium

      - name: Run browser pass
        if: inputs.only_sessions != 'true'
        working-directory: chrome-extension/tests
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
          CAMCASH_STAGING_BASE_URL: http://127.0.0.1:3000
          BROWSER_ARTIFACTS_DIR: ${{ github.workspace }}/browser-artifacts
        run: node staging-browser-pass.mjs

      - name: Run profile-security attack tests
        if: inputs.only_sessions != 'true' && (success() || failure())
        working-directory: chrome-extension/tests
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
          CAMCASH_STAGING_BASE_URL: http://127.0.0.1:3000
          BROWSER_ARTIFACTS_DIR: ${{ github.workspace }}/browser-artifacts
        run: node staging-profile-security.mjs

      - name: Run onboarding restore browser test
        if: inputs.only_sessions != 'true' && (success() || failure())
        working-directory: chrome-extension/tests
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
          CAMCASH_STAGING_BASE_URL: http://127.0.0.1:3000
          BROWSER_ARTIFACTS_DIR: ${{ github.workspace }}/browser-artifacts
        run: node staging-onboarding-restore.mjs

      - name: Run Sessions adaptive-layer browser test
        if: success() || failure()
        timeout-minutes: 8
        working-directory: chrome-extension/tests
        env:
          SUPABASE_STAGING_URL: ${{ secrets.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_ANON_KEY: ${{ secrets.SUPABASE_STAGING_ANON_KEY }}
          SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
          CAMCASH_STAGING_BASE_URL: http://127.0.0.1:3000
          BROWSER_ARTIFACTS_DIR: ${{ github.workspace }}/browser-artifacts
        run: node staging-sessions-modes.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-browser-pass-screenshots
          path: browser-artifacts/
          if-no-files-found: warn

      - name: Next.js server log on failure
        if: failure()
        run: tail -200 /tmp/camcash-next.log || true
