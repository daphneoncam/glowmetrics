name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glowmetrics_fresh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: glowmetrics_fresh/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (if configured)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            echo "Found a 'lint' script in package.json — running it."
            npm run lint
          else
            echo "No 'lint' script in package.json — skipping ESLint step."
          fi

      - name: Run estimated-hourly-rate verification
        run: node scripts/verify-estimated-hourly-rate.mjs

      - name: Run timezone guard
        run: node scripts/check-timezone.mjs

      - name: Run test suite
        run: npm test

      - name: Run production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
